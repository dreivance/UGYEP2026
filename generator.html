<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event QR Code Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Quicksand', -apple-system, sans-serif;
      margin: 0;
      padding: 30px 15px;
      background: linear-gradient(180deg, #70bbfd 0%, #a2d2ff 50%, #c8e6c9 100%);
      background-attachment: fixed;
      color: #1b4332;
      min-height: 100vh;
    }

    .flag-banner {
      width: 100%;
      height: 24px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      background-image: repeating-linear-gradient(45deg, #e53935 0 20px, #fdd835 20px 40px, #43a047 40px 60px, #1e88e5 60px 80px, #8e24aa 80px 100px);
      clip-path: polygon(0 0, 100% 0, 100% 70%, 95% 100%, 90% 70%, 85% 100%, 80% 70%, 75% 100%, 70% 70%, 65% 100%, 60% 70%, 55% 100%, 50% 70%, 45% 100%, 40% 70%, 35% 100%, 30% 70%, 25% 100%, 20% 70%, 15% 100%, 10% 70%, 5% 100%, 0 70%);
    }

    .container { max-width: 480px; margin: 10px auto 0 auto; }

    .card {
      background: #fffdf5;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
      border: 4px solid #2e7d32;
      outline: 4px solid #a5d6a7;
      text-align: center;
    }

    .banner-container { width: 100%; margin-bottom: 12px; border-radius: 12px; overflow: hidden; }
    .event-banner { width: 100%; display: block; border-radius: 12px; }
    .banner-fallback {
      display: none; background: linear-gradient(135deg, #d32f2f 0%, #1b8b22 100%); color: #fff;
      padding: 20px 10px; text-align: center; border-radius: 12px;
    }
    .banner-fallback h1 { margin: 0; font-family: 'Fredoka One', cursive; font-size: 22px; color: #fde047; }

    h2 { font-family: 'Fredoka One', cursive; color: #e65100; text-transform: uppercase; margin: 8px 0 2px 0; font-size: 26px; letter-spacing: 0.5px; }
    p.sub { color: #2e7d32; font-weight: 700; margin-top: 0; font-size: 13px; margin-bottom: 20px; }
    
    .input-group { margin-bottom: 14px; text-align: left; }
    
    label { display: block; font-weight: 700; margin-bottom: 4px; font-size: 12px; color: #2e7d32; text-transform: uppercase; }
    input { width: 100%; padding: 10px 12px; border: 2px solid #a5d6a7; border-radius: 10px; font-size: 14px; background: #fff; font-family: inherit; }
    input:focus { outline: none; border-color: #e65100; box-shadow: 0 0 0 3px rgba(230, 81, 0, 0.15); }

    /* Domain Autocomplete Pill */
    .domain-suggestion {
      display: none;
      margin-top: 6px;
      background: #e8f5e9;
      border: 1.5px solid #2e7d32;
      color: #1b5e20;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      width: fit-content;
      transition: background 0.15s, transform 0.1s;
    }
    .domain-suggestion:hover {
      background: #c8e6c9;
    }
    .domain-suggestion:active {
      transform: scale(0.97);
    }
    .domain-suggestion span {
      color: #e65100;
    }
    
    .photo-preview { width: 100px; height: 100px; border-radius: 10px; object-fit: cover; border: 2px solid #a5d6a7; margin-top: 8px; display: none; margin-left: auto; margin-right: auto; }

    button.action-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 14px;
      font-family: 'Fredoka One', cursive;
      font-size: 16px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: 0.2s;
      margin-top: 6px;
    }
    .btn-generate { background: linear-gradient(180deg, #ff8f00 0%, #e65100 100%); color: white; box-shadow: 0 5px 0 #b23c00; }
    .btn-generate:disabled { background: #b0bec5; box-shadow: none; cursor: not-allowed; }
    
    .btn-download { background: linear-gradient(180deg, #43a047 0%, #2e7d32 100%); color: white; box-shadow: 0 5px 0 #1b5e20; display: none; margin-top: 10px; }

    #qr-container {
      margin: 18px auto;
      padding: 16px;
      background: #ffffff;
      border: 3px dashed #2e7d32;
      border-radius: 16px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #final-qr-img {
      max-width: 100%;
      border-radius: 8px;
      display: block;
    }
    .table-assignment-box {
      margin-top: 12px;
      background: #e8f5e9;
      border: 2px solid #2e7d32;
      border-radius: 12px;
      padding: 10px 16px;
      width: 100%;
      max-width: 280px;
    }
    .table-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #2e7d32;
      letter-spacing: 0.8px;
    }
    .table-number-value {
      font-family: 'Fredoka One', cursive;
      font-size: 22px;
      color: #e65100;
      margin-top: 2px;
    }
    .table-not-found-note {
      font-size: 13px;
      font-weight: 700;
      color: #bf360c;
      line-height: 1.4;
      margin-top: 2px;
    }
    
    .status-msg { font-size: 13px; font-weight: bold; display: none; margin-bottom: 12px; padding: 8px; border-radius: 8px; }
    .status-error { color: #c62828; background: #ffebee; }
    .status-loading { color: #1b5e20; background: #e8f5e9; }
    .status-success { color: #1b5e20; background: #c8e6c9; }
    
    .footer-text { font-size: 11px; font-weight: bold; color: #a5d6a7; margin-top: 15px; letter-spacing: 1px; }
  </style>
</head>
<body>

  <div class="flag-banner"></div>

  <div class="container">
    <div class="card">
      <div class="banner-container">
        <img id="banner-img" src="banner.jpg" alt="Unified Fiesta" class="event-banner" onerror="handleBannerError()">
        <div id="banner-fallback" class="banner-fallback">
          <h1>🎉 UNIFIED FIESTA 🎉</h1>
        </div>
      </div>

      <h2>Fiesta Registration</h2>
      <p class="sub">Generate your personal QR code for entrance</p>

      <div class="status-msg" id="status-msg"></div>

      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" list="domain-options" placeholder="e.g. juan@unified-accounting.com" required autocomplete="off">
        <datalist id="domain-options"></datalist>
        <div id="domain-suggestion-pill" class="domain-suggestion" onclick="applyDomainSuggestion()">
          Tap to complete: <span id="suggested-email-text"></span>
        </div>
      </div>

      <div class="input-group">
        <label for="contact">Contact Number</label>
        <input type="tel" id="contact" placeholder="e.g. 09171234567" required autocomplete="tel">
      </div>

      <div class="input-group">
        <label for="selfie">Take a Selfie (For Verification)</label>
        <input type="file" id="selfie" accept="image/*" capture="user">
        <img id="photo-preview" class="photo-preview" alt="Selfie Preview">
      </div>

      <button class="action-btn btn-generate" id="generate-btn" onclick="processAndGenerate()">Generate My QR Code</button>

      <div id="qrcode-hidden" style="display:none;"></div>

      <div id="qr-container">
        <img id="final-qr-img" src="" alt="Your Event QR Code">
        <div class="table-assignment-box" id="table-box">
          <div class="table-label" id="table-box-label">Assigned Table</div>
          <div class="table-number-value" id="assigned-table-display">-</div>
        </div>
      </div>

      <button class="action-btn btn-download" id="download-btn" onclick="downloadQR()">⬇️ Save / Download QR Code</button>
      
      <div class="footer-text">UNIFIED GLOBAL · UNIFIED FIESTA</div>
    </div>
  </div>

  <script>
    let base64Image = "";
    let finalDownloadDataUrl = "";
    const DEFAULT_DOMAIN = "unified-accounting.com";
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3EhOPHIzcAmpBVH-gwUO1e6hHU-HgG2t6fwDIZNaOQJELWaA5CMpP1dOgHi9_ZUBI/exec";

    const UG_LOGO_SVG = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
        <rect width="120" height="120" rx="18" fill="#296b47"/>
        <path d="M 16 24 L 34 24 C 37 24 39 26 39 29 L 39 36 L 32 36 L 32 68 C 32 84 44 95 60 95 C 76 95 88 84 88 68 L 88 36 L 81 36 L 81 29 C 81 26 83 24 86 24 L 104 24 L 104 68 C 104 92 85 110 60 110 C 35 110 16 92 16 68 Z" fill="#ffffff"/>
        <path d="M 74 44 C 70 39 65 37 59 37 C 46 37 37 47 37 60 C 37 73 46 83 59 83 C 71 83 80 75 81 63 L 81 56 L 58 56 L 58 68 L 67 68 C 65 71 62 72 59 72 C 52 72 48 67 48 60 C 48 53 52 48 59 48 C 63 48 66 49 68 52 Z" fill="#ffffff"/>
      </svg>
    `;

    // Domain Autocomplete Handler
    const emailInput = document.getElementById('email');
    const suggestionPill = document.getElementById('domain-suggestion-pill');
    const suggestedText = document.getElementById('suggested-email-text');
    const dataList = document.getElementById('domain-options');

    emailInput.addEventListener('input', function() {
      const val = this.value.trim();
      const atIndex = val.indexOf('@');

      if (atIndex > 0) {
        const prefix = val.substring(0, atIndex);
        const typedDomain = val.substring(atIndex + 1).toLowerCase();
        const fullSuggestion = `${prefix}@${DEFAULT_DOMAIN}`;

        // Show suggestion pill if domain starts matching default domain and isn't already completed
        if (DEFAULT_DOMAIN.startsWith(typedDomain) && typedDomain !== DEFAULT_DOMAIN) {
          suggestedText.innerText = fullSuggestion;
          suggestionPill.style.display = 'inline-block';
          dataList.innerHTML = `<option value="${fullSuggestion}">`;
        } else {
          suggestionPill.style.display = 'none';
          dataList.innerHTML = '';
        }
      } else {
        suggestionPill.style.display = 'none';
        dataList.innerHTML = '';
      }
    });

    function applyDomainSuggestion() {
      emailInput.value = suggestedText.innerText;
      suggestionPill.style.display = 'none';
      dataList.innerHTML = '';
      document.getElementById('contact').focus();
    }

    function handleBannerError() {
      document.getElementById('banner-img').style.display = 'none';
      document.getElementById('banner-fallback').style.display = 'block';
    }

    document.getElementById('selfie').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_SIZE = 800; 
          let width = img.width, height = img.height;

          if (width > height) {
            if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
          } else {
            if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
          }

          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          base64Image = canvas.toDataURL('image/jpeg', 0.7); 
          const preview = document.getElementById('photo-preview');
          preview.src = base64Image;
          preview.style.display = 'block';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function showStatus(msg, type) {
      const statusEl = document.getElementById('status-msg');
      statusEl.innerText = msg;
      statusEl.className = `status-msg status-${type}`;
      statusEl.style.display = 'block';
    }

    async function processAndGenerate() {
      const email = document.getElementById('email').value.trim().toLowerCase();
      const contact = document.getElementById('contact').value.trim();
      const btn = document.getElementById('generate-btn');
      
      document.getElementById('status-msg').style.display = 'none';

      if (!email || !contact || !base64Image) {
        showStatus("Please enter your Email Address, Contact Number, and take a Selfie.", "error");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Generating QR & Checking Table...";
      showStatus("Uploading selfie & looking up table assignment...", "loading");

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" }, 
          body: JSON.stringify({ email: email, image: base64Image })
        });

        const result = await response.json();

        if (result.success) {
          const tableFound = result.tableFound === true;
          const tableNumber = result.table || "Unassigned";
          await generateCustomQRCode(contact, email, result.url, tableNumber, tableFound);
          showStatus("Success! Your QR code is ready.", "success");
        } else {
          throw new Error(result.error || "Failed to upload image.");
        }
      } catch (err) {
        console.error(err);
        showStatus("Error connecting to server. Please try again.", "error");
      } finally {
        btn.disabled = false;
        btn.innerText = "Generate My QR Code";
      }
    }

    function generateCustomQRCode(contact, email, driveUrl, tableNumber, tableFound) {
      return new Promise((resolve) => {
        const normalizedEmail = email.trim().toLowerCase();
        const payload = { n: normalizedEmail, c: contact, e: normalizedEmail, i: driveUrl, t: tableNumber };
        const qrString = JSON.stringify(payload);
        const hiddenContainer = document.getElementById('qrcode-hidden');
        hiddenContainer.innerHTML = "";

        new QRCode(hiddenContainer, {
          text: qrString,
          width: 240,
          height: 240,
          colorDark : "#1b5e20",
          colorLight : "#ffffff",
          correctLevel : QRCode.CorrectLevel.H
        });

        setTimeout(() => {
          const rawCanvas = hiddenContainer.querySelector("canvas");
          const logoImg = new Image();
          const svgBlob = new Blob([UG_LOGO_SVG], { type: 'image/svg+xml;charset=utf-8' });
          const svgUrl = URL.createObjectURL(svgBlob);

          logoImg.onload = function() {
            const qrCanvas = document.createElement('canvas');
            qrCanvas.width = 240;
            qrCanvas.height = 240;
            const qCtx = qrCanvas.getContext('2d');

            qCtx.drawImage(rawCanvas, 0, 0, 240, 240);

            const logoSize = 54;
            const pad = 4;
            const x = (240 - logoSize) / 2;
            const y = (240 - logoSize) / 2;

            qCtx.fillStyle = "#ffffff";
            qCtx.beginPath();
            qCtx.roundRect(x - pad, y - pad, logoSize + pad * 2, logoSize + pad * 2, 10);
            qCtx.fill();

            qCtx.drawImage(logoImg, x, y, logoSize, logoSize);

            const qrDataUrl = qrCanvas.toDataURL("image/png");
            document.getElementById('final-qr-img').src = qrDataUrl;

            const tableBox = document.getElementById('table-box');
            const tableLabel = document.getElementById('table-box-label');
            const tableDisplay = document.getElementById('assigned-table-display');

            if (tableFound) {
              tableBox.style.background = "#e8f5e9";
              tableBox.style.borderColor = "#2e7d32";
              tableLabel.style.display = "block";
              tableDisplay.className = "table-number-value";
              tableDisplay.innerText = tableNumber;
            } else {
              tableBox.style.background = "#fff3e0";
              tableBox.style.borderColor = "#e65100";
              tableLabel.style.display = "none";
              tableDisplay.className = "table-not-found-note";
              tableDisplay.innerText = "Table assignment not found. Kindly ask the registration team for your assigned table number.";
            }

            const passCanvas = document.createElement('canvas');
            passCanvas.width = 320;
            passCanvas.height = 395;
            const pCtx = passCanvas.getContext('2d');

            pCtx.fillStyle = "#fffdf5";
            pCtx.fillRect(0, 0, 320, 395);

            pCtx.strokeStyle = "#2e7d32";
            pCtx.lineWidth = 8;
            pCtx.strokeRect(4, 4, 312, 387);

            pCtx.fillStyle = "#e65100";
            pCtx.font = "bold 20px sans-serif";
            pCtx.textAlign = "center";
            pCtx.fillText("UNIFIED FIESTA PASS", 160, 36);

            pCtx.drawImage(qrCanvas, 40, 50, 240, 240);

            pCtx.fillStyle = "#1b4332";
            pCtx.font = "bold 14px sans-serif";
            pCtx.fillText(normalizedEmail, 160, 315);

            if (tableFound) {
              pCtx.fillStyle = "#e8f5e9";
              pCtx.fillRect(45, 330, 230, 44);
              pCtx.strokeStyle = "#2e7d32";
              pCtx.lineWidth = 2;
              pCtx.strokeRect(45, 330, 230, 44);

              pCtx.fillStyle = "#2e7d32";
              pCtx.font = "bold 16px sans-serif";
              pCtx.fillText("TABLE: " + tableNumber, 160, 358);
            } else {
              pCtx.fillStyle = "#fff3e0";
              pCtx.fillRect(25, 330, 270, 46);
              pCtx.strokeStyle = "#e65100";
              pCtx.lineWidth = 2;
              pCtx.strokeRect(25, 330, 270, 46);

              pCtx.fillStyle = "#bf360c";
              pCtx.font = "bold 11px sans-serif";
              pCtx.fillText("Table assignment not found.", 160, 349);
              pCtx.fillText("Ask registration for your table #", 160, 365);
            }

            finalDownloadDataUrl = passCanvas.toDataURL("image/png");

            const qrContainer = document.getElementById('qr-container');
            qrContainer.style.display = 'flex';
            document.getElementById('download-btn').style.display = 'block';
            qrContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });

            URL.revokeObjectURL(svgUrl);
            resolve();
          };
          logoImg.src = svgUrl;
        }, 120);
      });
    }

    function downloadQR() {
      const emailPrefix = document.getElementById('email').value.trim().toLowerCase().split('@')[0] || "guest";
      if (finalDownloadDataUrl) {
        const link = document.createElement('a');
        link.download = `Fiesta_QR_${emailPrefix}.png`;
        link.href = finalDownloadDataUrl;
        link.click();
      }
    }
  </script>

</body>
</html>
