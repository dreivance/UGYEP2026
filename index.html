<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Attendance QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Quicksand', -apple-system, sans-serif;
      margin: 0;
      padding: 30px 15px;
      background: linear-gradient(180deg, #70bbfd 0%, #a2d2ff 50%, #c8e6c9 100%);
      background-attachment: fixed;
      color: #1b4332;
      min-height: 100vh;
    }

    .flag-banner {
      width: 100%;
      height: 24px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      background-image: repeating-linear-gradient(45deg, #e53935 0 20px, #fdd835 20px 40px, #43a047 40px 60px, #1e88e5 60px 80px, #8e24aa 80px 100px);
      clip-path: polygon(0 0, 100% 0, 100% 70%, 95% 100%, 90% 70%, 85% 100%, 80% 70%, 75% 100%, 70% 70%, 65% 100%, 60% 70%, 55% 100%, 50% 70%, 45% 100%, 40% 70%, 35% 100%, 30% 70%, 25% 100%, 20% 70%, 15% 100%, 10% 70%, 5% 100%, 0 70%);
    }

    .container { max-width: 480px; margin: 10px auto 0 auto; }
    
    .card {
      background: #fffdf5;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
      border: 4px solid #2e7d32;
      outline: 4px solid #a5d6a7;
      text-align: center;
    }

    .banner-container { width: 100%; margin-bottom: 12px; border-radius: 12px; overflow: hidden; }
    .event-banner { width: 100%; display: block; border-radius: 12px; }
    .banner-fallback {
      display: none; background: linear-gradient(135deg, #d32f2f 0%, #1b8b22 100%); color: #fff;
      padding: 20px 10px; text-align: center; border-radius: 12px;
    }
    .banner-fallback h1 { margin: 0; font-family: 'Fredoka One', cursive; font-size: 22px; color: #fde047; }

    h2 { font-family: 'Fredoka One', cursive; color: #e65100; text-transform: uppercase; margin: 8px 0 2px 0; font-size: 24px; letter-spacing: 0.5px; }
    p.sub { color: #2e7d32; font-weight: 700; margin-top: 0; font-size: 13px; margin-bottom: 12px; }

    .device-bar { background: #e8f5e9; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; color: #1b5e20; margin-bottom: 12px; display: flex; justify-content: space-between; border: 1px solid #c8e6c9; }
    .device-btn { background: none; border: none; color: #e65100; font-weight: bold; text-decoration: underline; cursor: pointer; }

    #reader { width: 100%; border-radius: 12px; overflow: hidden; border: 3px solid #2e7d32; background: #000; }

    .status-msg { font-weight: bold; padding: 8px; border-radius: 8px; margin: 10px 0; display: none; font-size: 13px; }
    .status-success { background: #c8e6c9; color: #1b5e20; }
    .status-warning { background: #ffe0b2; color: #e65100; }

    .actions { display: flex; gap: 8px; margin: 12px 0; }
    button { flex: 1; padding: 10px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-family: 'Fredoka One', cursive; letter-spacing: 0.5px; font-size: 14px; text-transform: uppercase; }
    .btn-excel { background: #2e7d32; color: #fff; box-shadow: 0 4px 0 #1b5e20; }
    .btn-clear { background: #d32f2f; color: #fff; box-shadow: 0 4px 0 #b71c1c; }
    
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
    th, td { padding: 6px; text-align: left; border-bottom: 1px solid #e0e0e0; }
    th { background: #f1f8e9; color: #2e7d32; font-weight: bold; }

    /* Verification Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
    .modal-card { background: #fffdf5; border-radius: 18px; padding: 15px; width: 100%; max-width: 420px; text-align: center; border: 4px solid #2e7d32; max-height: 90vh; overflow-y: auto; }
    .modal-card h3 { font-family: 'Fredoka One', cursive; color: #e65100; font-size: 22px; margin: 0 0 4px 0; }
    .modal-subtitle { font-size: 12px; color: #2e7d32; font-weight: 700; margin-bottom: 12px; }

    /* Screen-Wide Full Photo */
    .modal-image-wrapper { width: 100%; margin-bottom: 12px; border-radius: 10px; overflow: hidden; border: 2px solid #2e7d32; background: #e8f5e9; }
    .modal-image { width: 100%; height: auto; max-height: 360px; object-fit: contain; display: block; }

    .details-box { background: #f1f8e9; border: 1px solid #c8e6c9; border-radius: 10px; padding: 10px; margin-bottom: 15px; text-align: left; }
    .details-label { font-size: 11px; text-transform: uppercase; color: #2e7d32; font-weight: bold; }
    .details-value { font-weight: bold; color: #1b4332; font-size: 14px; word-break: break-word; }

    .btn-confirm { background: #2e7d32; color: #fff; box-shadow: 0 4px 0 #1b5e20; }
    .btn-confirm:disabled { background: #9e9e9e; box-shadow: none; cursor: not-allowed; }
    .btn-cancel { background: #757575; color: #fff; box-shadow: 0 4px 0 #424242; }
  </style>
</head>
<body>

<div class="flag-banner"></div>

<div class="container">
  <div class="card">
    <div class="banner-container">
      <img id="banner-img" src="banner.jpg" alt="Unified Fiesta" class="event-banner" onerror="handleBannerError()">
      <div id="banner-fallback" class="banner-fallback">
        <h1>🎉 UNIFIED FIESTA 🎉</h1>
      </div>
    </div>

    <h2>Attendance Scanner</h2>
    <p class="sub">Scan QR Code to Check-In Participants</p>

    <div class="device-bar">
      <span>📱 Scanner: <span id="device-name-display">Not Set</span></span>
      <button class="device-btn" onclick="changeDeviceName()">Change</button>
    </div>

    <div id="status" class="status-msg"></div>
    <div id="reader"></div>

    <div class="actions">
      <button class="btn-excel" onclick="exportToExcel()">📥 Export Log</button>
      <button class="btn-clear" onclick="clearLogs()">🗑️ Clear</button>
    </div>

    <h3 style="margin: 10px 0 5px 0; color: #2e7d32; font-size: 14px; text-align: left;">Scanned Log (<span id="total-count">0</span>)</h3>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr><th>#</th><th>Name</th><th>Contact</th><th>Time</th></tr>
        </thead>
        <tbody id="log-table-body">
          <tr><td colspan="4" style="text-align:center; color:#888;">No scans yet</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="confirm-modal" class="modal-overlay">
  <div class="modal-card">
    <h3>Verify Attendee</h3>
    <p class="modal-subtitle">Confirm details match person holding the QR</p>
    
    <div class="modal-image-wrapper">
      <img id="modal-image" class="modal-image" src="" alt="Selfie Verification">
    </div>

    <div class="details-box">
      <div style="margin-bottom: 6px;">
        <span class="details-label">Full Name</span>
        <div id="modal-name" class="details-value">-</div>
      </div>
      <div style="margin-bottom: 6px;">
        <span class="details-label">Contact Number</span>
        <div id="modal-contact" class="details-value">-</div>
      </div>
      <div>
        <span class="details-label">Email Address</span>
        <div id="modal-email" class="details-value">-</div>
      </div>
    </div>

    <div style="display: flex; gap: 10px;">
      <button class="btn-cancel" onclick="cancelCheckIn()">❌ Reject</button>
      <button class="btn-confirm" id="confirm-btn" onclick="confirmCheckIn()">✅ Confirm</button>
    </div>
  </div>
</div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3EhOPHIzcAmpBVH-gwUO1e6hHU-HgG2t6fwDIZNaOQJELWaA5CMpP1dOgHi9_ZUBI/exec";
  
  let logs = JSON.parse(localStorage.getItem('attendance_logs') || '[]');
  let scannerDeviceName = localStorage.getItem('scanner_device_name') || "";
  
  let lastScannedText = "";
  let lastScannedTime = 0;
  let pendingRecord = null;
  let isConfirming = false;

  document.addEventListener('DOMContentLoaded', () => {
    checkDeviceName();
    renderTable();
    initScanner();
  });

  function checkDeviceName() {
    if (!scannerDeviceName) {
      scannerDeviceName = prompt("Enter a name for this scanner (e.g., Gate 1, Admin Phone):", "Scanner 1") || "Scanner 1";
      localStorage.setItem('scanner_device_name', scannerDeviceName);
    }
    document.getElementById('device-name-display').innerText = scannerDeviceName;
  }

  function changeDeviceName() {
    const newName = prompt("Update device name:", scannerDeviceName);
    if (newName && newName.trim()) {
      scannerDeviceName = newName.trim();
      localStorage.setItem('scanner_device_name', scannerDeviceName);
      document.getElementById('device-name-display').innerText = scannerDeviceName;
    }
  }

  function handleBannerError() {
    document.getElementById('banner-img').style.display = 'none';
    document.getElementById('banner-fallback').style.display = 'block';
  }

  function playChimeAndGreeting() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioContext();

      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const gain = ctx.createGain();

      osc1.type = 'sine'; osc1.frequency.value = 523.25; // C5
      osc2.type = 'sine'; osc2.frequency.value = 659.25; // E5

      osc1.connect(gain); osc2.connect(gain);
      gain.connect(ctx.destination);

      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);

      osc1.start(); osc2.start();
      osc1.stop(ctx.currentTime + 0.35);
      osc2.stop(ctx.currentTime + 0.35);
    } catch(e){}

    setTimeout(() => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); 
        const utterance = new SpeechSynthesisUtterance("Happy Fiesta!");
        utterance.pitch = 1.6;  
        utterance.rate = 1.1;   
        utterance.volume = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }, 200);
  }

  function parseQRData(qrText) {
    try {
      const parsed = JSON.parse(qrText);
      if (parsed.n || parsed.name) {
        let imageUrl = parsed.i || null;
        if (imageUrl && imageUrl.includes('drive.google.com/uc?export=view&id=')) {
          const id = imageUrl.split('id=')[1];
          imageUrl = 'https://lh3.googleusercontent.com/d/' + id;
        }
        return { 
          name: parsed.n || parsed.name || "N/A", 
          contact: parsed.c || parsed.contact || "N/A",
          email: parsed.e || "N/A",
          image: imageUrl
        };
      }
    } catch (e) {}
    return { name: qrText, contact: "N/A", email: "N/A", image: null };
  }

  function onScanSuccess(decodedText) {
    if (isConfirming) return;

    const now = Date.now();
    if (decodedText === lastScannedText && (now - lastScannedTime) < 3000) return;
    
    lastScannedText = decodedText;
    lastScannedTime = now;

    const parsed = parseQRData(decodedText);
    const isDuplicate = logs.some(entry => entry.Name === parsed.name && entry.Contact === parsed.contact);
    
    if (isDuplicate) {
      showStatus(`⚠️ ${parsed.name} is ALREADY checked in!`, 'warning');
      return;
    }

    pendingRecord = parsed;
    isConfirming = true;

    document.getElementById('modal-name').innerText = parsed.name;
    document.getElementById('modal-contact').innerText = parsed.contact;
    document.getElementById('modal-email').innerText = parsed.email;
    
    const imgEl = document.getElementById('modal-image');
    if (parsed.image) {
      imgEl.onerror = function() { this.style.display = 'none'; };
      imgEl.src = parsed.image;
      imgEl.style.display = 'block';
    } else {
      imgEl.style.display = 'none';
    }

    document.getElementById('confirm-modal').style.display = 'flex';
  }

  async function confirmCheckIn() {
    if (!pendingRecord) return;
    const confirmBtn = document.getElementById('confirm-btn');
    confirmBtn.disabled = true;
    confirmBtn.innerText = "Syncing...";

    playChimeAndGreeting();

    const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const dateString = new Date().toLocaleDateString();

    const record = {
      "#": logs.length + 1,
      "Name": pendingRecord.name,
      "Contact": pendingRecord.contact,
      "Email": pendingRecord.email,
      "Time": timeString,
      "Date": dateString
    };

    // Save locally
    logs.unshift(record);
    localStorage.setItem('attendance_logs', JSON.stringify(logs));
    renderTable();

    // Sync to Google Sheet
    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "log_attendance",
          name: pendingRecord.name,
          email: pendingRecord.email,
          contact: pendingRecord.contact,
          image: pendingRecord.image || "",
          device: scannerDeviceName
        })
      });
      showStatus(`✅ Checked in & Synced: ${pendingRecord.name}`, 'success');
    } catch(e) {
      console.error(e);
      showStatus(`⚠️ Saved locally (Sheet sync failed)`, 'warning');
    }

    confirmBtn.disabled = false;
    confirmBtn.innerText = "✅ Confirm";
    closeModal();
  }

  function cancelCheckIn() {
    showStatus(`❌ Check-in canceled`, 'warning');
    closeModal();
  }

  function closeModal() {
    document.getElementById('confirm-modal').style.display = 'none';
    pendingRecord = null;
    setTimeout(() => { isConfirming = false; }, 1200);
  }

  function showStatus(msg, type) {
    const statusEl = document.getElementById('status');
    statusEl.className = `status-msg status-${type}`;
    statusEl.innerText = msg;
    statusEl.style.display = 'block';
    setTimeout(() => { statusEl.style.display = 'none'; }, 3000);
  }

  function renderTable() {
    const tbody = document.getElementById('log-table-body');
    document.getElementById('total-count').innerText = logs.length;

    if (logs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#888;">No scans yet</td></tr>';
      return;
    }

    tbody.innerHTML = logs.map((log, index) => `
      <tr>
        <td>${logs.length - index}</td>
        <td><strong>${escapeHtml(log.Name)}</strong></td>
        <td>${escapeHtml(log.Contact)}</td>
        <td>${log.Time}</td>
      </tr>
    `).join('');
  }

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, function(m) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]; });
  }

  function exportToExcel() {
    if (logs.length === 0) { alert("No data to export!"); return; }
    const worksheet = XLSX.utils.json_to_sheet(logs);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Attendance");
    XLSX.writeFile(workbook, `Attendance_Log_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  function clearLogs() {
    if (logs.length === 0) return;
    const password = prompt("Enter password (admin123) to clear local logs:");
    if (password === "admin123") {
      logs = []; localStorage.removeItem('attendance_logs'); renderTable(); showStatus("✅ Local logs cleared.", "success");
    }
  }

  function initScanner() {
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 220, height: 220 }, facingMode: "environment" }, false);
    html5QrcodeScanner.render(onScanSuccess);
  }
</script>

</body>
</html>
